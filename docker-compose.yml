services:
  netwatch:
    image: ghcr.io/okuyanf61/netwatch:latest
    container_name: netwatch
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - netwatch-data:/data
    # Everything below is optional; these are the defaults.
    # environment:
    #   NETWATCH_INTERVAL: "60"
    #   NETWATCH_RETENTION_DAYS: "365"
    #   NETWATCH_TARGETS: "1.1.1.1,8.8.8.8,9.9.9.9"

volumes:
  netwatch-data:
