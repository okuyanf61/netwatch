name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a main/tag run halfway through tagging or pushing images
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Compile
        run: python -m py_compile netwatch.py scripts/next_release.py
      - name: Smoke test
        run: |
          NETWATCH_DB=/tmp/nw.db NETWATCH_INTERVAL=5 python netwatch.py &
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          sleep 7
          curl -fs 'localhost:8080/api/data?range=24h' | python -c 'import json,sys; d=json.load(sys.stdin); assert d["last"], d; print("last check:", d["last"])'
          curl -fs localhost:8080/ | grep -q '<title>netwatch</title>'

  # Conventional Commits on main -> semver tag + GitHub release (see scripts/next_release.py).
  # Tags made with GITHUB_TOKEN don't trigger new workflow runs, so the image job
  # below picks the version up from this job's output instead.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out next version
        id: next
        run: |
          v=$(python3 scripts/next_release.py notes.md)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -z "$v" ]; then echo "No feat/fix/breaking commits since the last tag, nothing to release."; exit 0; fi
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n**Full changelog:** https://github.com/%s/compare/%s...v%s\n' "$GITHUB_REPOSITORY" "$prev" "$v" >> notes.md
          fi
          echo "Releasing v$v"; cat notes.md

      - name: Tag and publish release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.next.outputs.version }}
        run: gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md

  image:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags are needed for git describe

      - name: Version
        id: ver
        # fresh release -> 1.2.3; otherwise git describe: v1.2.3 tag -> 1.2.3, commits after it -> 1.2.3-4-gabc1234
        env:
          RELEASED: ${{ needs.release.outputs.version }}
        run: |
          v="$RELEASED"
          [ -n "$v" ] || v=$(git describe --tags --always --match 'v*' | sed 's/^v//')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=netwatch
            org.opencontainers.image.description=Tiny zero-config internet uptime monitor for Raspberry Pi and friends

      - name: Build for smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: netwatch:test
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name nw -p 8080:8080 netwatch:test
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs 'localhost:8080/api/data?range=7d' | python3 -c 'import json,sys; v=json.load(sys.stdin)["version"]; print("version:", v); assert v == "${{ steps.ver.outputs.version }}", v'
          docker logs nw
          docker rm -f nw

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
